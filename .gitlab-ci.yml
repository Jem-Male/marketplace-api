# 1. Сначала мы просто объявляем список этапов (как вы и написали)
stages:
  - build
  - test
  - deploy

# 2. А теперь даем роботу конкретные задания для каждого этапа
compile_code:          # Название задачи (придумываете сами)
  stage: build         # Говорим роботу: "Эта задача относится к этапу build"
  script:
    - echo "Собираем код и превращаем его в программу..."

run_unit_tests:        # Название второй задачи
  stage: test          # Говорим роботу: "Это делать только на этапе test"
  script:
    - echo "Запускаем тесты. Ищем ошибки..."

upload_to_server:      # Название третьей задачи
  stage: deploy        # Говорим роботу: "Это финал, этап deploy"
  script:
    - echo "Код проверен! Копируем файлы на живой сервер..."
